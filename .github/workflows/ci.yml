name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  rust:
    name: fmt · test · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Smoke harness
        run: cargo run -p aegis_harness -- --suite smoke --compare-baseline --no-log

      - name: Golden assert
        run: cargo run -p aegis_harness -- --assert-golden --no-auto-engage --no-log

      - name: Class sample
        run: >
          cargo run -p aegis_harness -- --batch
          --class mixed_rf_dark_raid,direct_swarm_raid
          --seed-start 1 --seed-count 3 --ticks 250 --no-log
