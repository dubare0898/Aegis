[workspace]
resolver = "2"
members = [
  "crates/aegis_schema",
  "crates/aegis_sim",
  "crates/aegis_fusion",
  "crates/aegis_recommend",
  "crates/aegis_scenario",
  "crates/aegis_api",
  "tools/aegis_harness",
]
exclude = [
  "apps/desktop/src-tauri",
]
default-members = ["crates/aegis_api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aegis contributors"]

[workspace.dependencies]
aegis_schema = { path = "crates/aegis_schema" }
aegis_sim = { path = "crates/aegis_sim" }
aegis_fusion = { path = "crates/aegis_fusion" }
aegis_recommend = { path = "crates/aegis_recommend" }
aegis_scenario = { path = "crates/aegis_scenario" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
